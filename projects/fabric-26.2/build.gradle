plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

version = '1.0.2'
group = 'com.qiaosylveon'

base {
    archivesName = 'AFKFarm-1.0.2-fabric-26.2'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.4+29b6eb019e"
}

sourceSets {
    main {
        java {
            srcDirs += [
                file('../../common/src/main/java'),
                file('../../versions/26.2/src/main/java'),
                file('../../loaders/fabric/src/main/java')
            ]
        }
        resources {
            srcDirs += [
                file('../../common/src/main/resources'),
                file('src/main/resources')
            ]
        }
    }
}

loom {
    mods {
        "afkfarm" {
            sourceSet sourceSets.main
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
